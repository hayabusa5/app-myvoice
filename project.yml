# XcodeGen の設定。`xcodegen generate` で MyVoice.xcodeproj ができる。
name: MyVoice
options:
  bundleIdPrefix: com.takasub5
  deploymentTarget:
    iOS: "17.0"
    macOS: "14.0"
  developmentLanguage: ja
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: BLLFXPJGG7
targets:
  MyVoice:
    type: application
    platform: iOS
    sources:
      - App
      - Shared
      - SharedUI
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: マイ音声入力
        AppIdentifierPrefix: $(AppIdentifierPrefix)
        NSMicrophoneUsageDescription: キーボードで話した声を文字にするために使います。
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        # キーボードの歯車ボタンから、このアプリを開くため
        CFBundleURLTypes:
          - CFBundleURLName: com.takasub5.MyVoice
            CFBundleURLSchemes: [myvoice]
    entitlements:
      path: App/MyVoice.entitlements
      properties:
        keychain-access-groups: [$(AppIdentifierPrefix)com.takasub5.MyVoice.shared]
    dependencies:
      - target: MyVoiceKeyboard
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.takasub5.MyVoice
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1,2"
  MyVoiceKeyboard:
    type: app-extension
    platform: iOS
    sources:
      - Keyboard
      - Shared
    info:
      path: Keyboard/Info.plist
      properties:
        CFBundleDisplayName: マイ音声入力
        AppIdentifierPrefix: $(AppIdentifierPrefix)
        NSMicrophoneUsageDescription: キーボードで話した声を文字にするために使います。
        NSExtension:
          NSExtensionPointIdentifier: com.apple.keyboard-service
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).KeyboardViewController
          NSExtensionAttributes:
            IsASCIICapable: false
            PrefersRightToLeft: false
            PrimaryLanguage: ja-JP
            RequestsOpenAccess: true
    entitlements:
      path: Keyboard/MyVoiceKeyboard.entitlements
      properties:
        keychain-access-groups: [$(AppIdentifierPrefix)com.takasub5.MyVoice.shared]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.takasub5.MyVoice.Keyboard
        TARGETED_DEVICE_FAMILY: "1,2"
        APPLICATION_EXTENSION_API_ONLY: YES
  MyVoiceMac:
    type: application
    platform: macOS
    sources:
      - Mac
      - Shared
      - SharedUI
    info:
      path: Mac/Info.plist
      properties:
        CFBundleDisplayName: マイ音声入力
        LSUIElement: true
        NSMicrophoneUsageDescription: Caps Lockを押している間に話した声を文字にするために使います。
    settings:
      base:
        PRODUCT_NAME: マイ音声入力
        PRODUCT_BUNDLE_IDENTIFIER: com.takasub5.MyVoice.mac
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # 自分のMacで動かすだけなので、プロファイルなしで開発用証明書で署名する
        # (署名が変わらないので、アクセシビリティの許可が更新後も残る)
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: Apple Development
        PROVISIONING_PROFILE_SPECIFIER: ""
        ENABLE_HARDENED_RUNTIME: NO
schemes:
  MyVoice:
    build:
      targets:
        MyVoice: all
        MyVoiceKeyboard: all
    run:
      config: Debug
  MyVoiceMac:
    build:
      targets:
        MyVoiceMac: all
    run:
      config: Debug
