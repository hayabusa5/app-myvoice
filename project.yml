# XcodeGen の設定。`xcodegen generate` で MyVoice.xcodeproj ができる。
name: MyVoice
options:
  bundleIdPrefix: com.takasub5
  deploymentTarget:
    iOS: "17.0"
    macOS: "14.0"
  developmentLanguage: ja
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: BLLFXPJGG7
targets:
  MyVoice:
    type: application
    platform: iOS
    sources:
      - App
      - Shared
      - SharedUI
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: マイ音声入力
        AppIdentifierPrefix: $(AppIdentifierPrefix)
        NSMicrophoneUsageDescription: キーボードで話した声を文字にするために使います。
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        # iPadは全方向にしないとApp Store Connectへ上げられない(マルチタスクの条件)
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        # 通信はHTTPSだけなので、輸出規制の暗号化には当たらない
        ITSAppUsesNonExemptEncryption: false
        # キーボードの歯車ボタンから、このアプリを開くため
        CFBundleURLTypes:
          - CFBundleURLName: com.takasub5.MyVoice
            CFBundleURLSchemes: [myvoice]
    entitlements:
      path: App/MyVoice.entitlements
      properties:
        keychain-access-groups: [$(AppIdentifierPrefix)com.takasub5.MyVoice.shared]
        # iPhoneとMacで辞書を同期する(iCloudのキー値ストア。Mac版も同じIDを使う)
        com.apple.developer.ubiquity-kvstore-identifier: $(TeamIdentifierPrefix)com.takasub5.MyVoice
    dependencies:
      - target: MyVoiceKeyboard
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.takasub5.MyVoice
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1,2"
  MyVoiceKeyboard:
    type: app-extension
    platform: iOS
    sources:
      - Keyboard
      - Shared
    info:
      path: Keyboard/Info.plist
      properties:
        CFBundleDisplayName: マイ音声入力
        AppIdentifierPrefix: $(AppIdentifierPrefix)
        NSMicrophoneUsageDescription: キーボードで話した声を文字にするために使います。
        NSExtension:
          NSExtensionPointIdentifier: com.apple.keyboard-service
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).KeyboardViewController
          NSExtensionAttributes:
            IsASCIICapable: false
            PrefersRightToLeft: false
            PrimaryLanguage: ja-JP
            RequestsOpenAccess: true
    entitlements:
      path: Keyboard/MyVoiceKeyboard.entitlements
      properties:
        keychain-access-groups: [$(AppIdentifierPrefix)com.takasub5.MyVoice.shared]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.takasub5.MyVoice.Keyboard
        TARGETED_DEVICE_FAMILY: "1,2"
        APPLICATION_EXTENSION_API_ONLY: YES
  MyVoiceMac:
    type: application
    platform: macOS
    sources:
      - Mac
      - Shared
      - SharedUI
    entitlements:
      path: Mac/MyVoiceMac.entitlements
      properties:
        com.apple.developer.ubiquity-kvstore-identifier: $(TeamIdentifierPrefix)com.takasub5.MyVoice
    info:
      path: Mac/Info.plist
      properties:
        CFBundleDisplayName: マイ音声入力
        LSUIElement: true
        # Claude Codeなどから辞書に語を足す: open "myvoice-mac://add-term?wrong=…&right=…"
        CFBundleURLTypes:
          - CFBundleURLName: com.takasub5.MyVoice.mac
            CFBundleURLSchemes: [myvoice-mac]
        NSMicrophoneUsageDescription: Caps Lockを押している間に話した声を文字にするために使います。
    settings:
      base:
        PRODUCT_NAME: マイ音声入力
        PRODUCT_BUNDLE_IDENTIFIER: com.takasub5.MyVoice.mac
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # iCloud(辞書の同期)を使うので、プロファイル付きの自動署名にする
        CODE_SIGN_STYLE: Automatic
        ENABLE_HARDENED_RUNTIME: NO
schemes:
  MyVoice:
    build:
      targets:
        MyVoice: all
        MyVoiceKeyboard: all
    run:
      config: Debug
  MyVoiceMac:
    build:
      targets:
        MyVoiceMac: all
    run:
      config: Debug
